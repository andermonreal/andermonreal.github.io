name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # A tool-cache Python, so `pip install pillow` works (the runner's system
      # Python refuses pip installs, PEP 668).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sync the Projects page with GitHub before building. Uses the automatic
      # GITHUB_TOKEN only to raise the API rate limit; on any error the script
      # keeps the committed _data/projects_generated.json as a fallback.
      - name: Sync GitHub projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby tools/fetch-projects.rb

      # Different spellings of one tag ("LFI"/"lfi") share a tag page and
      # overwrite each other; unify them before building (stdlib only).
      - name: Normalize tag spellings
        run: python tools/normalize-tags.py

      # 1200x630 link-preview cards (LinkedIn, X…) for every writeup plus the
      # site card; _includes/head.html points og:image at them.
      - name: Generate social preview cards
        run: |
          python -m pip install --quiet --disable-pip-version-check pillow
          python tools/make-social-cards.py

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/" \
            \-\-ignore-files "/\/projects\/[^\/]+\/index\.html$/"

      # Encrypt password-protected posts (front-matter `protected: true`) with
      # StatiCrypt AFTER htmlproofer and BEFORE upload, so the deployed pages
      # are real AES-encrypted HTML. The shared password lives in the
      # STATICRYPT_PASSWORD repository secret (Settings → Secrets and variables
      # → Actions). The list of pages to encrypt is read from the build-time
      # manifest /assets/protected.json, which is deleted before deploy.
      - name: Encrypt protected posts
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          set -euo pipefail
          SITE="_site${{ steps.pages.outputs.base_path }}"
          MANIFEST="$SITE/assets/protected.json"

          # Nothing flagged as protected → nothing to do.
          if [ ! -f "$MANIFEST" ] || [ "$(jq 'length' "$MANIFEST")" -eq 0 ]; then
            echo "No protected posts found. Skipping encryption."
            rm -f "$MANIFEST"
            exit 0
          fi

          # Fail loudly rather than publish protected posts in clear text.
          if [ -z "${STATICRYPT_PASSWORD:-}" ]; then
            echo "::error::Protected posts found but the STATICRYPT_PASSWORD secret is not set. Aborting to avoid publishing them unencrypted."
            exit 1
          fi

          npm install -g staticrypt@3

          TEMPLATE="tools/staticrypt-template.html"

          # Escape a value for the replacement side of a sed s|…|…| expression.
          esc() { printf '%s' "$1" | sed -e 's/[\\|&]/\\&/g'; }

          # Each manifest entry is a JSON object {url, title, image, difficulty,
          # os, platform, lang, email, page} — see assets/protected.json.
          mapfile -t rows < <(jq -c '.[]' "$MANIFEST")
          for row in "${rows[@]}"; do
            url=$(jq -r '.url' <<<"$row")
            title=$(jq -r '.title' <<<"$row")
            image=$(jq -r '.image // ""' <<<"$row")
            diff=$(jq -r '.difficulty // ""' <<<"$row")
            os=$(jq -r '.os // ""' <<<"$row")
            platform=$(jq -r '.platform // ""' <<<"$row")
            lang=$(jq -r '.lang // "en"' <<<"$row")
            email=$(jq -r '.email // ""' <<<"$row")
            page=$(jq -r '.page // ""' <<<"$row")
            [ -z "$image" ] && image="/assets/img/avatar.jpeg"
            [ -z "$platform" ] && platform="HackTheBox"

            f="${SITE}${url}index.html"
            if [ ! -f "$f" ]; then
              echo "::warning::Protected page not found, skipping: $f"
              continue
            fi

            # Per-post password page: the machine card (art, difficulty, OS,
            # platform), the copy in the page's language and a prefilled
            # "Request access" email. "none" hides a missing badge.
            diff_class=$(tr '[:upper:]' '[:lower:]' <<<"${diff:-none}")
            os_class="${os:-none}"
            tpl="$(mktemp)"
            sed -e "s|%%LANG%%|$(esc "$lang")|g" \
                -e "s|%%POST_IMAGE%%|$(esc "$image")|g" \
                -e "s|%%PLATFORM%%|$(esc "$platform")|g" \
                -e "s|%%DIFF_CLASS%%|$(esc "$diff_class")|g" \
                -e "s|%%DIFF%%|$(esc "$diff")|g" \
                -e "s|%%OS_CLASS%%|$(esc "$os_class")|g" \
                -e "s|%%OS%%|$(esc "${os^}")|g" \
                -e "s|%%EMAIL%%|$(esc "$email")|g" \
                -e "s|%%TITLE_URI%%|$(esc "$(jq -rn --arg s "$title" '$s|@uri')")|g" \
                -e "s|%%PAGE_URI%%|$(esc "$(jq -rn --arg s "$page" '$s|@uri')")|g" \
                "$TEMPLATE" > "$tpl"

            if [ "$lang" = "es" ]; then
              t_instr="¿Tienes la contraseña? Introdúcela para leer el writeup completo."
              t_button="Desbloquear"; t_placeholder="Contraseña"; t_remember="Recordarme"
              t_error="Contraseña incorrecta, inténtalo de nuevo."
              t_show="Mostrar contraseña"; t_hide="Ocultar contraseña"
            else
              t_instr="Have the password? Enter it to unlock the full writeup."
              t_button="Unlock"; t_placeholder="Password"; t_remember="Remember me"
              t_error="Wrong password, try again."
              t_show="Show password"; t_hide="Hide password"
            fi

            out="$(mktemp -d)"
            # `--short` skips StatiCrypt's interactive "short password" prompt
            # (which would hang in CI). `< /dev/null` guards against any other
            # prompt blocking on stdin.
            ( cd "$(dirname "$f")" && staticrypt index.html \
                --password "$STATICRYPT_PASSWORD" \
                --config false \
                --short \
                --template "$tpl" \
                --template-title "$title" \
                --template-instructions "$t_instr" \
                --template-button "$t_button" \
                --template-placeholder "$t_placeholder" \
                --template-remember "$t_remember" \
                --template-error "$t_error" \
                --template-toggle-show "$t_show" \
                --template-toggle-hide "$t_hide" \
                --directory "$out" < /dev/null )
            mv "$out/index.html" "$f"
            rm -rf "$out" "$tpl"
            echo "Encrypted: $f  (title: $title)"
          done

          # Don't ship the manifest listing which posts are protected.
          rm -f "$MANIFEST"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
